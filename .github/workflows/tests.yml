name: Testes automatizados do MVP
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt coverage
      - name: Executar testes unitarios e de integracao
        run: |
          python -m coverage run --source=app,database,inventory -m unittest discover -s tests -v
          python -m coverage report -m
